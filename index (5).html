<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campos de direcciones · Actividad 2.2.2.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1f;--pn:#111833;--in:#0d1430;--ln:#1f2a52;--tx:#e8ecff;--mu:#8a94b8;--g:linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899,#fb923c)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);background:radial-gradient(900px 480px at 10% -8%,#2d1d6b66,transparent),radial-gradient(800px 460px at 100% 0,#0a4f7566,transparent),var(--bg);background-attachment:fixed;font:15px/1.6 "Space Grotesk",system-ui,sans-serif}
header,main{max-width:1180px;margin:0 auto;padding:0 20px}
header{padding-top:44px}
h1{font-size:clamp(2.2rem,7vw,4.2rem);line-height:1.02;font-weight:700;letter-spacing:-.03em;margin:0 0 20px;background:linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899,#fb923c,#22d3ee);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 14s linear infinite}
@keyframes flow{to{background-position:-300% 0}}
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 24px}
.ficha div{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 14px}
.ficha dt{font-size:.75rem;color:var(--mu)}
.ficha dd{margin:0;font-weight:500}
#tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
#tabs button{font:inherit;font-weight:500;color:var(--mu);background:var(--pn);border:1px solid var(--ln);border-radius:999px;padding:9px 18px;cursor:pointer;transition:transform .15s,color .15s}
#tabs button:hover{color:var(--tx);transform:translateY(-2px)}
#tabs button[aria-selected=true]{color:#0a0f1f;background:var(--g);border-color:transparent;font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid #22d3ee;outline-offset:3px}
.stage{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.stage{grid-template-columns:1fr}}
canvas{display:block;width:100%;background:var(--in);border:1px solid var(--ln);border-radius:16px}
#cv{aspect-ratio:16/11;cursor:crosshair;touch-action:pan-y}
#pc{aspect-ratio:4/3}
.rd{margin-top:10px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:9px 14px;font:12.5px/1.5 "JetBrains Mono",ui-monospace,monospace;min-height:42px;white-space:pre-wrap}
.card,#side{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:22px}
h2{font-size:1.5rem;line-height:1.2;margin:0 0 10px}
p{margin:0 0 12px}
.mu,figcaption{color:var(--mu);font-size:.88rem}
.eq{font:italic 1.35rem/1.4 "Cambria Math",Cambria,Georgia,serif;background:var(--in);border-radius:10px;padding:10px 14px;margin:14px 0}
.eq2{font:italic 1.05rem "Cambria Math",Cambria,Georgia,serif;color:var(--tx)}
#ctl{display:grid;gap:8px;margin:16px 0}
#ctl label{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;font-size:.88rem}
#ctl input{width:100%;accent-color:#8b5cf6}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button{font:inherit;font-size:.85rem;color:var(--tx);background:var(--in);border:1px solid var(--ln);border-radius:999px;padding:7px 14px;cursor:pointer}
.btns button[aria-pressed=true]{background:var(--g);color:#0a0f1f;border-color:transparent;font-weight:700}
.more{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
@media(max-width:900px){.more{grid-template-columns:1fr}}
figure{margin:0}
figcaption{margin-top:8px}
table{width:100%;border-collapse:collapse;font:12.5px "JetBrains Mono",ui-monospace,monospace}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-weight:600}
th:first-child,td:first-child{text-align:left}
td i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
#obs{border-left:3px solid #8b5cf6;padding:4px 0 4px 16px;margin:0 0 56px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){h1{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Campos de direcciones</h1>
  <!-- EDITA AQUÍ tus datos -->
  <dl class="ficha">
    <div><dt>Alumno</dt><dd>Castro Pérez Agustín</dd></div>
    <div><dt>Universidad</dt><dd>Universidad Politécnica de Atlautla</dd></div>
    <div><dt>Actividad</dt><dd>2.2.2.1</dd></div>
    <div><dt>Fecha</dt><dd>18/11/2026</dd></div>
  </dl>
  <nav id="tabs" role="tablist"></nav>
</header>
<main>
  <section class="stage">
    <div><canvas id="cv" role="img" aria-label="Campo de direcciones interactivo"></canvas><div class="rd" id="rd"></div></div>
    <aside id="side"></aside>
  </section>
  <section class="more">
    <div class="card"><figure><canvas id="pc" role="img" aria-label="Línea de fase"></canvas><figcaption>Línea de fase: la pendiente según el valor de la variable. Los puntos magenta son equilibrios.</figcaption></figure></div>
    <div class="card"><figure><table id="tb"></table><figcaption>Valores de las soluciones para cada C. El color coincide con la curva.</figcaption></figure></div>
  </section>
  <p id="obs"></p>
</main>

<script>
const $=s=>document.querySelector(s);
const range=(a,b,s)=>{const r=[];for(let v=a;v<=b+1e-9;v+=s)r.push(+v.toFixed(4));return r};
const M=[
{s:'Difusión de calor',t:'Difusión de calor',
 d:'Grafica el campo de direcciones del modelo de difusión de calor (Ley de Enfriamiento de Newton) y analiza las soluciones para C desde −2 hasta 2.',
 eq:'dT/dt = −k (T − T<sub>amb</sub>)',
 w:'T es la temperatura del cuerpo, T<sub>amb</sub> la temperatura ambiente y k la constante de enfriamiento.',
 sol:'T(t) = T<sub>amb</sub> + C e<sup>−kt</sup>',
 xl:'t (min)',yl:'T (°C)',xn:'t',yn:'T',dl:'dT/dt',
 p:[{k:'k',l:'k',a:.1,b:1.5,s:.05,v:.5},{k:'Ta',l:'T ambiente',a:10,b:30,s:1,v:20}],
 f:(x,y,p)=>-p.k*(y-p.Ta),dom:p=>[0,10,p.Ta-3,p.Ta+3],ics:p=>range(-2,2,.5).map(c=>p.Ta+c),cv:(y,p)=>y-p.Ta,eq0:p=>p.Ta,
 o:'Todas las curvas tienden a T = T<sub>amb</sub>. Si C &gt; 0 el cuerpo se enfría desde arriba; si C &lt; 0 se calienta desde abajo. Con k mayor llega más rápido.'},
{s:'Flujo en tubería',t:'Flujo en tubería horizontal',
 d:'Representa las líneas de flujo de la velocidad del fluido en una tubería horizontal y explora las soluciones para distintos valores de C.',
 eq:'dv/dx = −(f / 2D) v |v|',
 w:'v es la velocidad, f el coeficiente de fricción y D el diámetro de la tubería.',
 sol:'1/v = (f/2D) x + 1/C &nbsp;(para v &gt; 0)',
 xl:'x (m)',yl:'v (m/s)',xn:'x',yn:'v',dl:'dv/dx',
 p:[{k:'f',l:'f',a:.01,b:.1,s:.01,v:.02},{k:'D',l:'D',a:.05,b:.5,s:.05,v:.1}],
 f:(x,y,p)=>-(p.f/(2*p.D))*y*Math.abs(y),dom:p=>[0,10,-3,3],ics:p=>range(-3,3,.5),cv:y=>y,eq0:p=>0,
 o:'La fricción frena más lo que va más rápido: las curvas decaen como 1/x hacia v = 0. Las de C &gt; 0 y C &lt; 0 son simétricas.'},
{s:'Fricción lineal',t:'Movimiento bajo fricción lineal',
 d:'Grafica el campo de direcciones del movimiento de una partícula con fricción lineal y evalúa las soluciones según distintos valores de C.',
 eq:'dv/dt = −b v + F',
 w:'v es la velocidad, b la constante de fricción y F una fuerza constante.',
 sol:'v(t) = F/b + (C − F/b) e<sup>−bt</sup>',
 xl:'t (s)',yl:'v (m/s)',xn:'t',yn:'v',dl:'dv/dt',
 p:[{k:'b',l:'b',a:.4,b:2,s:.1,v:.8},{k:'F',l:'F',a:0,b:5,s:.5,v:2}],
 f:(x,y,p)=>-p.b*y+p.F,dom:p=>[0,8,-2,6],ics:p=>range(-2,6,1),cv:y=>y,eq0:p=>p.F/p.b,
 o:'Toda velocidad inicial tiende a la velocidad límite v = F/b. Más fricción b baja ese límite y se alcanza antes.'},
{s:'Población logística',t:'Crecimiento poblacional logístico',
 d:'Representa el campo de trayectorias del crecimiento logístico y analiza el comportamiento para C desde 0 hasta 6 millones de personas.',
 eq:'dN/dt = r N (1 − N / K)',
 w:'N es la población, r la tasa de crecimiento y K la capacidad máxima.',
 sol:'N(t) = K / (1 + ((K − C)/C) e<sup>−rt</sup>)',
 xl:'t (años)',yl:'N (millones)',xn:'t',yn:'N',dl:'dN/dt',
 p:[{k:'r',l:'r',a:.2,b:1.2,s:.1,v:.6},{k:'K',l:'K (millones)',a:2,b:6,s:.5,v:4}],
 f:(x,y,p)=>p.r*y*(1-y/p.K),dom:p=>[0,12,0,6.5],ics:p=>range(0,6,.5),cv:y=>y,eq0:p=>p.K,
 o:'Hay dos equilibrios: N = 0 (inestable) y N = K (estable). Si C &lt; K crece en forma de S; si C &gt; K baja hasta K.'}
];

const PAL=[[34,211,238],[139,92,246],[236,72,153],[251,146,60]];
const pal=t=>{const s=Math.min(.9999,Math.max(0,t))*3,i=Math.floor(s),f=s-i,a=PAL[i],b=PAL[i+1];return 'rgb('+a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(',')+')'};
const dec=d=>d>=1?(Number.isInteger(d)?0:1):2;
function rk4(f,x0,y0,x1,p,n=240){const h=(x1-x0)/n;let x=x0,y=y0;const o=[[x,y]];
 for(let i=0;i<n;i++){const a=f(x,y,p),b=f(x+h/2,y+h*a/2,p),c=f(x+h/2,y+h*b/2,p),d=f(x+h,y+h*c,p);y+=h*(a+2*b+2*c+d)/6;x+=h;o.push([x,y])}return o}

const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const P=M.map(m=>Object.fromEntries(m.p.map(q=>[q.k,q.v])));
const S={i:0,seeds:M.map(()=>[]),hv:null,flow:!reduced,rev:0,t0:0};
const cv=$('#cv'),pc=$('#pc'),base=document.createElement('canvas'),lay=document.createElement('canvas');
const HINT='Pasa el cursor o toca la gráfica para ver los valores.\nToca para lanzar tu propia curva solución.';
let ctx,G,CV=[],CS=[],raf=0;

function setup(c,w,h){const d=devicePixelRatio||1;c.width=Math.round(w*d);c.height=Math.round(h*d);const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return g}
function frame(g,w,h,x0,x1,y0,y1,xl,yl){
 const L=54,R=12,T=12,B=42,pw=w-L-R,ph=h-T-B,X=x=>L+(x-x0)/(x1-x0)*pw,Y=y=>T+ph-(y-y0)/(y1-y0)*ph;
 g.font='11px "JetBrains Mono",ui-monospace,monospace';g.fillStyle='#8a94b8';
 const dx=(x1-x0)/5,dy=(y1-y0)/5;
 for(let i=0;i<=5;i++){const x=x0+dx*i,y=y0+dy*i;
  g.strokeStyle='#18224a';g.lineWidth=1;g.beginPath();g.moveTo(X(x),T);g.lineTo(X(x),T+ph);g.moveTo(L,Y(y));g.lineTo(L+pw,Y(y));g.stroke();
  g.textAlign='center';g.fillText(x.toFixed(dec(dx)),X(x),T+ph+16);
  g.textAlign='right';g.fillText(y.toFixed(dec(dy)),L-8,Y(y)+4)}
 g.textAlign='center';g.fillText(xl,L+pw/2,h-6);
 g.save();g.translate(12,T+ph/2);g.rotate(-Math.PI/2);g.fillText(yl,0,0);g.restore();
 g.strokeStyle='#3a4676';g.beginPath();g.moveTo(L,T);g.lineTo(L,T+ph);g.lineTo(L+pw,T+ph);g.stroke();
 return{X,Y,iX:px=>x0+(px-L)/pw*(x1-x0),iY:py=>y0+(T+ph-py)/ph*(y1-y0),L,T,pw,ph,kx:pw/(x1-x0),ky:ph/(y1-y0)}
}

function paint(){
 const m=M[S.i],p=P[S.i],w=cv.clientWidth,h=cv.clientHeight;if(!w)return;
 ctx=setup(cv,w,h);const gb=setup(base,w,h),gl=setup(lay,w,h);
 const [x0,x1,y0,y1]=m.dom(p);
 G=frame(gb,w,h,x0,x1,y0,y1,m.xl,m.yl);
 const {X,Y,L,T,pw,ph,kx,ky}=G;
 gb.save();gb.beginPath();gb.rect(L,T,pw,ph);gb.clip();
 const nx=Math.round(pw/30),ny=Math.round(ph/26);
 gb.strokeStyle='#2c3a72';gb.lineWidth=1.2;gb.beginPath();
 for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){
  const x=x0+(i+.5)/nx*(x1-x0),y=y0+(j+.5)/ny*(y1-y0),s=m.f(x,y,p),n=Math.hypot(kx,s*ky)||1,ux=kx/n*6,uy=-s*ky/n*6;
  gb.moveTo(X(x)-ux,Y(y)-uy);gb.lineTo(X(x)+ux,Y(y)+uy)}
 gb.stroke();
 const e=m.eq0(p);gb.setLineDash([6,5]);gb.strokeStyle='rgba(232,236,255,.45)';gb.beginPath();gb.moveTo(L,Y(e));gb.lineTo(L+pw,Y(e));gb.stroke();
 gb.restore();
 const ics=m.ics(p);
 CV=ics.map((c,i)=>({pts:rk4(m.f,x0,c,x1,p),col:pal(ics.length>1?i/(ics.length-1):0)}));
 gl.beginPath();gl.rect(L,T,pw,ph);gl.clip();gl.lineWidth=2.2;
 CV.forEach(o=>{gl.strokeStyle=o.col;gl.shadowColor=o.col;gl.shadowBlur=7;gl.beginPath();o.pts.forEach(([x,y],k)=>k?gl.lineTo(X(x),Y(y)):gl.moveTo(X(x),Y(y)));gl.stroke()});
 seedsCalc();
}
function seedsCalc(){const m=M[S.i],p=P[S.i],[x0,x1]=m.dom(p);
 CS=S.seeds[S.i].map(([x,y])=>{const f=rk4(m.f,x,y,x1,p,120),b=rk4(m.f,x,y,x0,p,120).reverse();return{pts:b.concat(f.slice(1)),col:'#ffffff',seed:[x,y]}})}

function render(now){
 const m=M[S.i],p=P[S.i],w=cv.clientWidth,h=cv.clientHeight,g=ctx;if(!g||!G)return;
 const {X,Y,L,T,pw,ph,kx,ky}=G,e=1-Math.pow(1-S.rev,3);
 g.clearRect(0,0,w,h);g.drawImage(base,0,0,w,h);
 g.save();g.beginPath();g.rect(L,T,pw*e+1,ph);g.clip();g.drawImage(lay,0,0,w,h);g.restore();
 g.save();g.beginPath();g.rect(L,T,pw,ph);g.clip();
 CS.forEach(o=>{g.strokeStyle='#fff';g.lineWidth=2.6;g.shadowColor='#fff';g.shadowBlur=10;g.beginPath();o.pts.forEach(([x,y],k)=>k?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y)));g.stroke();
  g.shadowBlur=0;g.fillStyle='#0a0f1f';g.lineWidth=2;g.beginPath();g.arc(X(o.seed[0]),Y(o.seed[1]),4.5,0,7);g.fill();g.stroke()});
 if(S.flow&&S.rev>=1){g.shadowBlur=12;CV.concat(CS).forEach((o,k)=>{const u=(now/7000+k*.173)%1,[x,y]=o.pts[Math.floor(u*(o.pts.length-1))];g.fillStyle=o.col;g.shadowColor=o.col;g.beginPath();g.arc(X(x),Y(y),3.6,0,7);g.fill()});g.shadowBlur=0}
 if(S.hv){const [hx,hy]=S.hv,s=m.f(hx,hy,p),px=X(hx),py=Y(hy),n=Math.hypot(kx,s*ky)||1,ux=kx/n*34,uy=-s*ky/n*34;
  g.shadowBlur=0;g.setLineDash([4,4]);g.strokeStyle='rgba(232,236,255,.35)';g.lineWidth=1;g.beginPath();g.moveTo(px,T);g.lineTo(px,T+ph);g.moveTo(L,py);g.lineTo(L+pw,py);g.stroke();g.setLineDash([]);
  g.strokeStyle='#fff';g.lineWidth=2.5;g.beginPath();g.moveTo(px-ux,py-uy);g.lineTo(px+ux,py+uy);g.stroke();
  g.fillStyle='#fff';g.beginPath();g.arc(px,py,4,0,7);g.fill()}
 g.restore();
}
function tick(now){raf=0;if(S.rev<1)S.rev=Math.min(1,Math.max(0,(now-S.t0)/1100));render(now);if(S.flow||S.rev<1)kick()}
function kick(){if(!raf)raf=requestAnimationFrame(tick)}

function paintPhase(){
 const m=M[S.i],p=P[S.i],w=pc.clientWidth,h=pc.clientHeight;if(!w)return;
 const [,,y0,y1]=m.dom(p),N=160,ys=[],fs=[];
 for(let i=0;i<=N;i++){const y=y0+(y1-y0)*i/N;ys.push(y);fs.push(m.f(0,y,p))}
 let a=Math.min(...fs,0),b=Math.max(...fs,0);const pad=(b-a)*.12||1;a-=pad;b+=pad;
 const g=setup(pc,w,h),F=frame(g,w,h,y0,y1,a,b,m.yl,m.dl);
 g.strokeStyle='#3a4676';g.beginPath();g.moveTo(F.L,F.Y(0));g.lineTo(F.L+F.pw,F.Y(0));g.stroke();
 g.strokeStyle='#22d3ee';g.lineWidth=2.4;g.beginPath();ys.forEach((y,i)=>i?g.lineTo(F.X(y),F.Y(fs[i])):g.moveTo(F.X(y),F.Y(fs[i])));g.stroke();
 g.fillStyle='#ec4899';
 for(let i=0;i<N;i++){let r=null;
  if(fs[i]===0)r=ys[i];else if(fs[i]*fs[i+1]<0)r=ys[i]-fs[i]*(ys[i+1]-ys[i])/(fs[i+1]-fs[i]);
  if(r!==null){g.beginPath();g.arc(F.X(r),F.Y(0),4.8,0,7);g.fill()}}
}
function paintTable(){
 const m=M[S.i],p=P[S.i],[x0,x1]=m.dom(p),mid=(x0+x1)/2,ics=m.ics(p),st=Math.ceil(ics.length/7),n=240,hd=x=>m.yn+'('+x+')';
 let h='<thead><tr><th>C</th><th>'+hd(x0)+'</th><th>'+hd(mid)+'</th><th>'+hd(x1)+'</th></tr></thead><tbody>';
 ics.forEach((y,i)=>{if(i%st)return;const r=rk4(m.f,x0,y,x1,p,n);
  h+='<tr><td><i style="background:'+pal(ics.length>1?i/(ics.length-1):0)+'"></i>'+m.cv(y,p).toFixed(1)+'</td><td>'+y.toFixed(2)+'</td><td>'+r[n/2][1].toFixed(2)+'</td><td>'+r[n][1].toFixed(2)+'</td></tr>'});
 $('#tb').innerHTML=h+'</tbody>';
}
function refresh(){paint();paintPhase();paintTable();kick()}
function replay(){S.rev=reduced?1:0;S.t0=performance.now();refresh()}

function hover(px,py){
 const m=M[S.i],p=P[S.i];if(!G)return;
 if(px<G.L||px>G.L+G.pw||py<G.T||py>G.T+G.ph){S.hv=null;$('#rd').textContent=HINT;kick();return}
 const x=G.iX(px),y=G.iY(py);S.hv=[x,y];
 $('#rd').textContent=m.xn+' = '+x.toFixed(2)+'    '+m.yn+' = '+y.toFixed(2)+'    '+m.dl+' = '+m.f(x,y,p).toFixed(3);kick();
}
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointermove',e=>hover(...pos(e)));
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){S.hv=null;$('#rd').textContent=HINT;kick()}});
cv.addEventListener('click',e=>{const [px,py]=pos(e);hover(px,py);if(!S.hv)return;
 const a=S.seeds[S.i];a.push(S.hv.slice());if(a.length>8)a.shift();seedsCalc();kick()});

function build(i){
 S.i=i;S.hv=null;const m=M[i];
 document.querySelectorAll('#tabs button').forEach((b,k)=>b.setAttribute('aria-selected',k===i));
 $('#side').innerHTML='<h2>'+m.t+'</h2><p>'+m.d+'</p><div class="eq">'+m.eq+'</div><p class="mu">'+m.w+'</p><p class="mu">Solución general: <i class="eq2">'+m.sol+'</i></p><div id="ctl"></div>'
  +'<div class="btns"><button id="bf" aria-pressed="'+S.flow+'">Flujo</button><button id="br">Repetir</button><button id="bc">Borrar mis curvas</button></div>';
 m.p.forEach(q=>{
  const lb=document.createElement('label'),out=document.createElement('span'),inp=document.createElement('input');
  inp.type='range';inp.min=q.a;inp.max=q.b;inp.step=q.s;inp.value=P[i][q.k];
  const up=()=>{out.textContent=q.l+' = '+(+P[i][q.k]).toFixed(q.s<.1?2:1)};up();
  inp.oninput=()=>{P[i][q.k]=+inp.value;up();S.rev=1;refresh()};
  lb.append(out,inp);$('#ctl').appendChild(lb)});
 $('#bf').onclick=e=>{S.flow=!S.flow;e.target.setAttribute('aria-pressed',S.flow);kick()};
